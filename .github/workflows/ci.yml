name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell (bash -n / zsh -n)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar zsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zsh

      - name: Syntax check — configs zsh
        run: |
          fail=0
          for f in zsh/.config/zsh/*.zsh vendor/shell-utils/zsh/*.zsh; do
            [ -f "$f" ] || continue
            echo "zsh -n $f"
            zsh -n "$f" || fail=1
          done
          exit "$fail"

  test:
    name: bats tests/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # zsh es necesario porque test_zsh.bats corre `zsh -n` sobre los configs
      - name: Instalar zsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zsh

      # Mismo método que documenta tests/README.md para Linux
      - name: Instalar bats-core
        run: |
          git clone https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      # tests/ son smoke tests: verifican rutas de error (sin args, dep
      # faltante, fichero inexistente), no invocan subfinder/httpx/dnsx/etc.
      # de verdad — ver tests/README.md. No hace falta instalar ese stack.
      - name: Run bats
        run: bats --formatter tap tests/
