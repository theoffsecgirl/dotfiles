# Starship — theoffsecgirl
# Los colores salen de la paleta del final. El comando `theme` genera una copia
# con la paleta del tema elegido y la activa vía STARSHIP_CONFIG.
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "neon_fuchsia"

format = """
[╭─](bold primary)[ ](primary)${env_var.THEME_ICON}$username[@](accent)$hostname $directory$git_branch$git_status$python$golang$nodejs$docker_context$cmd_duration
[╰─](bold primary)$character"""

[env_var.THEME_ICON]
variable = "THEME_ICON"   # emoji del tema (🎃, 🍁…); si no existe, no se muestra
format   = "$env_value "

[username]
show_always = true
style_user  = "bold secondary"
style_root  = "bold red"
format      = "[$user]($style)"

[hostname]
ssh_only = false
style    = "bold accent"
format   = "[$hostname]($style)"
trim_at  = "-de-"

[directory]
style             = "bold primary"
read_only         = " 󰌾"
read_only_style   = "red"
truncation_length = 3
truncation_symbol = "…/"
format            = "[ ](muted)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style  = "bold extra"
format = "[on](muted) [$symbol$branch]($style) "

[git_status]
style  = "bold yellow"
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[python]
symbol = " "
style  = "accent"
format = "[$symbol$version(\\($virtualenv\\))]($style) "

[golang]
symbol = " "
style  = "accent"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style  = "green"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style  = "accent"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 2000
style    = "muted"
format   = "[ $duration]($style) "

[character]
success_symbol = "[❯](bold primary)[❯](bold secondary)[❯](bold accent)"
error_symbol   = "[✗](bold red)"
vimcmd_symbol  = "[❮](bold accent)"

# >>> palettes — todo lo que hay debajo lo reemplaza `theme` (no añadir nada después)
[palettes.neon_fuchsia]
primary   = "#ff2bd6"
secondary = "#ff7ae6"
accent    = "#00e5ff"
extra     = "#8a7bff"
muted     = "#a48bc2"
red       = "#ff2e63"
green     = "#3dffb0"
yellow    = "#ffd166"
